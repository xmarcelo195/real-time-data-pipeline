services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.7.1
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.7.1
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"

  kafka-init:
    image: confluentinc/cp-kafka:7.7.1
    depends_on:
      - kafka
    volumes:
      - ./kafka-init/create-topics.sh:/tmp/create-topics.sh
    entrypoint: ["/bin/bash", "/tmp/create-topics.sh"]

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    depends_on:
      - kafka
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - ./clickhouse/init:/docker-entrypoint-initdb.d

  grafana:
    image: grafana/grafana:11.2.0
    depends_on:
      - clickhouse
    ports:
      - "3000:3000"
    environment:
      GF_INSTALL_PLUGINS: grafana-clickhouse-datasource
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards

  ingestion-service:
    build:
      context: ./ingestion-service
    depends_on:
      - kafka-init
    environment:
      SOURCE_TYPE: simulated
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      TRANSACTIONS_TOPIC: btc.transactions
      SIM_ADDRESS_COUNT: 5000
      SIM_TARGET_TPS: 40
      SIM_MAX_LATENESS_MS: 15000
      SIM_WHALE_THRESHOLD: 50
      SIM_STRUCTURING_CEILING: 0.99

  jobmanager:
    build:
      context: ./flink-job
    command: jobmanager
    ports:
      - "8081:8081"
    environment:
      JOB_MANAGER_RPC_ADDRESS: jobmanager
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        state.checkpoints.dir: file:///tmp/flink-checkpoints
        state.savepoints.dir: file:///tmp/flink-savepoints
        execution.checkpointing.externalized-checkpoint-retention: RETAIN_ON_CANCELLATION
    depends_on:
      - kafka-init
      - redis
      - clickhouse

  taskmanager:
    build:
      context: ./flink-job
    command: taskmanager
    depends_on:
      - jobmanager
    environment:
      JOB_MANAGER_RPC_ADDRESS: jobmanager
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        taskmanager.numberOfTaskSlots: 4

  flink-submit:
    build:
      context: ./flink-job
    depends_on:
      - jobmanager
      - taskmanager
    environment:
      REDIS_HOST: redis
      CLICKHOUSE_HOST: clickhouse
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      TRANSACTIONS_TOPIC: btc.transactions
      ALERTS_TOPIC: btc.alerts
      METRICS_TOPIC: btc.metrics
      FLINK_PARALLELISM: 2
      FLINK_CHECKPOINT_MS: 10000
      FLINK_LATE_TOLERANCE_MS: 30000
      AML_WHALE_THRESHOLD: 40
      AML_STRUCTURING_COUNT_THRESHOLD: 6
      AML_STRUCTURING_CEILING: 1.0
      AML_VELOCITY_TX_THRESHOLD: 12
    entrypoint: ["/submit-job.sh"]
